<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Orders Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .topbar {
      background: linear-gradient(135deg, #1e3a2b 0%, #2b6e4e 100%);
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }

    .brand {
      font-weight: 800;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-weight: 600;
    }

    .nav a:hover {
      background: rgba(255,255,255,0.18);
    }

    .container {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px 40px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 3vw, 2.8rem);
      color: #0f172a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 26px;
    }

    .stat-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
      border: 1px solid #e5e7eb;
    }

    .stat-label {
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 0.75rem;
      font-weight: 800;
      color: #64748b;
    }

    .stat-value {
      margin-top: 10px;
      font-size: clamp(1.7rem, 2vw, 2.3rem);
      font-weight: 900;
      color: #0f172a;
    }

    .orders-panel {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      padding: 20px;
      border: 1px solid #e5e7eb;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .clear-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: #dc2626;
    }

    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .order-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #e2e8f0;
      border-left: 6px solid #2b6e4e;
      border-radius: 18px;
      padding: 18px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 10px;
    }

    .order-id {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
    }

    .order-meta {
      color: #64748b;
      font-size: 0.9rem;
    }

    .status-pill {
      background: #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .item-row:last-child { border-bottom: none; }

    .item-row img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .item-name {
      flex: 1;
      font-weight: 700;
      color: #1f2937;
    }

    .item-qty {
      color: #64748b;
      min-width: 60px;
      text-align: center;
    }

    .item-price {
      font-weight: 800;
      color: #2b6e4e;
      min-width: 80px;
      text-align: right;
    }

    .order-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      border-top: 1px dashed #e2e8f0;
      padding-top: 12px;
    }

    .order-total {
      font-size: 1.4rem;
      font-weight: 900;
      color: #2b6e4e;
    }

    .empty {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
      text-align: center;
      padding: 35px 20px;
      color: #64748b;
      font-size: 1.05rem;
    }

    .empty i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      color: #cbd5e1;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 14px 18px;
      }

      .nav {
        width: 100%;
      }

      .nav a {
        flex: 1 1 auto;
        text-align: center;
      }

      .item-row {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><i class="fas fa-user-shield"></i> Admin Panel</div>
    <nav class="nav">
      <a href="p.html"><i class="fas fa-store"></i> Customer Website</a>
      <a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <h1>Order Management Dashboard</h1>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value" id="totalOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Revenue</div>
        <div class="stat-value" id="totalRevenue">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Items Sold</div>
        <div class="stat-value" id="itemCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>
    </section>

    <section class="orders-panel">
      <div class="panel-header">
        <h2>Recent Customer Orders</h2>
        <button class="clear-btn" id="clearOrdersBtn"><i class="fas fa-trash"></i> Clear All</button>
      </div>
      <div id="ordersList" class="orders-list"></div>
    </section>
  </main>

  <script>
    const ordersKey = 'digitalCanteenOrders';
    const totalOrdersEl = document.getElementById('totalOrders');
    const totalRevenueEl = document.getElementById('totalRevenue');
    const itemCountEl = document.getElementById('itemCount');
    const pendingCountEl = document.getElementById('pendingCount');
    const ordersListEl = document.getElementById('ordersList');
    const clearOrdersBtn = document.getElementById('clearOrdersBtn');

    function readOrders() {
      try {
        const data = JSON.parse(localStorage.getItem(ordersKey) || '[]');
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveOrders(orders) {
      localStorage.setItem(ordersKey, JSON.stringify(orders));
    }

    function renderAdminPage() {
      const orders = readOrders();
      const totalRevenue = orders.reduce((sum, order) => sum + Number(order.total || 0), 0);
      const totalItems = orders.reduce((sum, order) => sum + (Array.isArray(order.items) ? order.items.reduce((s, item) => s + Number(item.qty || 0), 0) : 0), 0);

      totalOrdersEl.textContent = orders.length;
      totalRevenueEl.textContent = `₹${totalRevenue}`;
      itemCountEl.textContent = totalItems;
      pendingCountEl.textContent = Math.max(0, orders.length - 1);

      if (!orders.length) {
        ordersListEl.innerHTML = `
          <div class="empty">
            <i class="fas fa-receipt"></i>
            No orders have been placed yet.
          </div>
        `;
        return;
      }

      const reversed = [...orders].reverse();
      ordersListEl.innerHTML = reversed.map(order => {
        const statusText = order.paymentStatus === 'paid' ? 'Paid' : (order.status === 'preparing' ? 'Preparing' : (order.status === 'delivery' ? 'Out for Delivery' : 'Placed'));
        return `
        <article class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">Order #${order.orderId}</div>
              <div class="order-meta"><i class="far fa-calendar-alt"></i> ${order.date}</div>
            </div>
            <div class="status-pill">${statusText}</div>
          </div>

          ${Array.isArray(order.items) ? order.items.map(item => `
            <div class="item-row">
              <img src="${item.img || 'https://images.unsplash.com/...'}" alt="${item.name}" />
              <div class="item-name">${item.name}</div>
              <div class="item-qty">x${item.qty}</div>
              <div class="item-price">₹${Number(item.price || 0) * Number(item.qty || 0)}</div>
            </div>
          `).join('') : ''}

          <div class="order-bottom">
            <span class="order-meta">Total Amount</span>
            <div class="order-total">₹${order.total}</div>
          </div>

          <div style="margin-top: 14px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
            <button class="send-message-btn" data-order-id="${order.orderId}" data-action="preparing" style="background: #f59e0b; color: white; border: none; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer;">Start Preparing</button>
            <button class="send-message-btn" data-order-id="${order.orderId}" data-action="delivery" style="background: #10b981; color: white; border: none; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer;">Delivery in time</button>
            <button class="send-message-btn" data-order-id="${order.orderId}" data-action="paid" style="background: #2563eb; color: white; border: none; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer;">Mark Paid</button>
          </div>
        </article>
      `;
      }).join('');

      document.querySelectorAll('.send-message-btn').forEach(button => {
        button.addEventListener('click', () => {
          const orderId = button.dataset.orderId;
          const orders = readOrders();
          const selectedOrder = orders.find(order => String(order.orderId) === String(orderId));

          if (!selectedOrder) return;

          const itemText = selectedOrder.items.map(item => `${item.name} x${item.qty}`).join(', ');
          const action = button.dataset.action || 'success';

          let nextStatus = 'Placed';
          let message = `Your order #${selectedOrder.orderId} has been confirmed. You ordered ${itemText}. Total amount: ₹${selectedOrder.total}.`;

          if (action === 'preparing') {
            nextStatus = 'Preparing';
            message = `Your order #${selectedOrder.orderId} is being prepared. Estimated delivery time: 15 minutes. Please keep ₹${selectedOrder.total} ready in the app.`;
          } else if (action === 'delivery') {
            nextStatus = 'On the way';
            message = `Your order #${selectedOrder.orderId} is out for delivery. It will reach you soon. Please keep ₹${selectedOrder.total} ready in the app.`;
          } else if (action === 'paid') {
            nextStatus = 'Paid';
            message = `Payment received for order #${selectedOrder.orderId}. Thank you for ordering from College Canteen.`;
          }

          selectedOrder.status = action === 'preparing' ? 'preparing' : (action === 'delivery' ? 'delivery' : (action === 'paid' ? 'paid' : 'placed'));
          if (action === 'paid') {
            selectedOrder.paymentStatus = 'paid';
          }

          localStorage.setItem('digitalCanteenOrders', JSON.stringify(orders));
          localStorage.setItem('canteenCustomerMessage', JSON.stringify({
            text: message,
            expiresAt: Date.now() + 15000
          }));

          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.value = 880;
          gainNode.gain.value = 0.03;
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.18);

          renderAdminPage();
          alert('Customer notification sent successfully for 15 seconds.');
        });
      });
    }

    clearOrdersBtn.addEventListener('click', () => {
      if (!readOrders().length) {
        alert('No orders to clear.');
        return;
      }

      const proceed = confirm('Are you sure you want to delete all customer orders?');
      if (!proceed) return;

      saveOrders([]);
      renderAdminPage();
      alert('All orders were deleted successfully.');
    });

    window.addEventListener('storage', (event) => {
      if (event.key === 'digitalCanteenOrders') {
        renderAdminPage();
      }
    });

    renderAdminPage();
  </script>
</body>
</html>
